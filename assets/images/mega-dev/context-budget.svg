<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Context is a budget</title>
  <desc id="d">A bar representing a model's full context window. The first 30 to 40 percent is marked as the range where models work best; the rest still fits but quality tends to drop.</desc>
  <defs>
    <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f7f93"/>
      <stop offset="1" stop-color="#d5dadd"/>
    </linearGradient>
  </defs>
  <rect width="720" height="230" fill="#ffffff"/>

  <text x="40" y="34" font-size="18" font-weight="600" fill="#313639">Context window: ~250k to 1M tokens</text>

  <!-- bar: x 40..680 = 0..100% -->
  <rect x="40" y="70" width="192" height="44" fill="#2f7f93"/>
  <rect x="232" y="70" width="64" height="44" fill="url(#fade)"/>
  <rect x="296" y="70" width="384" height="44" fill="#d5dadd"/>
  <rect x="40" y="70" width="640" height="44" fill="none" stroke="#494e52" stroke-width="1"/>

  <text x="136" y="97" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Works best</text>
  <text x="488" y="97" font-size="14" fill="#494e52" text-anchor="middle">Still fits, but quality tends to drop</text>

  <!-- ticks -->
  <g stroke="#494e52" stroke-width="1">
    <line x1="40" y1="114" x2="40" y2="124"/>
    <line x1="232" y1="114" x2="232" y2="124"/>
    <line x1="296" y1="114" x2="296" y2="124"/>
    <line x1="680" y1="114" x2="680" y2="124"/>
  </g>
  <g font-size="13" fill="#494e52" text-anchor="middle">
    <text x="40" y="141">0%</text>
    <text x="232" y="141">30%</text>
    <text x="296" y="141">40%</text>
    <text x="680" y="141">100%</text>
  </g>

  <text x="40" y="184" font-size="14" fill="#494e52">Rule of thumb: keep usage under 30–40% of the window.</text>
  <text x="40" y="206" font-size="14" fill="#494e52">Compaction stretches a thread further, but each summary drops details.</text>
</svg>
