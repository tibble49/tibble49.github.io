<!-- Mermaid diagrams: turns ```mermaid code blocks in posts into rendered diagrams.
     The library only loads on pages that contain a mermaid block. -->
<script type="module">
  const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
  if (blocks.length) {
    const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs");
    blocks.forEach((block) => {
      const container = block.matches("div") ? block : block.closest("pre");
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.textContent = block.textContent;
      container.replaceWith(diagram);
    });
    mermaid.initialize({ startOnLoad: false, theme: "neutral" });
    await mermaid.run({ querySelector: "pre.mermaid" });
  }
</script>
<style>
  pre.mermaid { background: transparent; text-align: center; border: 0; }
</style>
